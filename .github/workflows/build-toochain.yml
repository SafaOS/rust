name: "Build SafaOS's toolchain"

on: [push]
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: build
      run: ./build.sh
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        # Artifact name
        name: x86_64-unknown-safaos
        # A file, directory or wildcard pattern that describes what to upload
        path: x86_64-unknown-safaos-toolchain
    - name: Prepare Release
      if: startsWith(github.ref, 'refs/tags/')
      run: tar -zcvf toolchain.tar x86_64-unknown-safaos-toolchain/*
    - uses: qoomon/actions--access-token@v3
      id: access-token
      with:
        permissions: |
            contents: write
    - name: Release
      uses: softprops/action-gh-release@v2
      # Release only if it's a tag
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          toolchain.tar
        token: ${{steps.access-token.outputs.token}}
